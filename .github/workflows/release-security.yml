name: Release security gates

# Runs on demand for release validation and on every push to default branches.
# Read-only, secret-free: it never uploads repository content to a third party
# and has no access to repository secrets. Any credential must come from the
# repository itself, never from CI configuration.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-security:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke security check
        run: npm run test:smoke

      # A few regression fixtures intentionally run commands outside the
      # checkout and test unsafe runtimes. The default production policy still
      # falls back to workspace; only this disposable CI job opts into open.
      - name: Prepare isolated regression permission policy
        run: |
          mkdir -p "$RUNNER_TEMP/lcp-ci"
          printf '{"version":1,"profile":"open"}\\n' > "$RUNNER_TEMP/lcp-ci/permissions.json"

      - name: Unit/regression suite
        env:
          PERMISSIONS_CONFIG: ${{ runner.temp }}/lcp-ci/permissions.json
        run: npm test

      - name: Integration suite
        run: npm run test:integration

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Audit all dependencies (incl. dev)
        run: npm audit

      - name: Tracked-HEAD credential pattern gate
        run: node scripts/check-publication-content.mjs
