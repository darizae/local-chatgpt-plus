name: Release security gates

# Runs on demand for release validation and on every push to default branches.
# No repository secrets are supplied. Registry / OSV checks transmit only
# public dependency metadata, not source files, credentials, or test fixtures.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-security:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce a single pinned package manager
        run: |
          test ! -e package-lock.json
          test ! -e npm-shrinkwrap.json
          node -e 'if (!/^pnpm@[0-9]+\.[0-9]+\.[0-9]+$/.test(require("./package.json").packageManager)) process.exit(1)'

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies without executing lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify registry package signatures before executing build scripts
        run: pnpm audit signatures

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Audit all dependencies (including dev)
        run: pnpm audit

      - name: Cross-check all pinned dependencies with OSV
        run: node scripts/check-osv-dependencies.mjs

      - name: Run approved native dependency builds and root postinstall
        run: pnpm rebuild

      - name: Build
        run: pnpm run build

      - name: Smoke security check
        run: pnpm run test:smoke

      # A few regression fixtures intentionally run commands outside the
      # checkout and test unsafe runtimes. The default production policy still
      # falls back to workspace; only this disposable CI job opts into open.
      - name: Prepare isolated regression permission policy
        run: |
          mkdir -p "$RUNNER_TEMP/lcp-ci"
          echo '{"version":1,"profile":"open"}' > "$RUNNER_TEMP/lcp-ci/permissions.json"

      - name: Unit/regression suite
        env:
          PERMISSIONS_CONFIG: ${{ runner.temp }}/lcp-ci/permissions.json
        run: pnpm test

      - name: Integration suite
        run: pnpm run test:integration

      - name: Tracked-HEAD credential pattern gate
        run: node scripts/check-publication-content.mjs
