# External systemd observer only; do not launch a competing tunnel.
[Service]
Environment=LCP_SYSTEMD_TUNNEL_MONITOR=1
Environment=LCP_DURABLE_JOBS_SOCKET=/run/lcp-durable-jobs/jobs.sock
Environment=LOCAL_CODER_MANAGE_TUNNEL=0
# Writable caches inside the existing workspace mount, not the read-only home.
Environment=XDG_CACHE_HOME=/home/agent/workspaces/projects/.lcp-cache
Environment=XDG_CONFIG_HOME=/home/agent/workspaces/projects/.lcp-cache/config
Environment=MPLCONFIGDIR=/home/agent/workspaces/projects/.lcp-cache/config/matplotlib
Environment=DOCKER_CONFIG=/home/agent/workspaces/projects/.lcp-cache/docker
Environment=npm_config_cache=/home/agent/workspaces/projects/.lcp-cache/npm
Environment=XDG_DATA_HOME=/home/agent/workspaces/projects/.lcp-cache/data
Environment=PIP_CACHE_DIR=/home/agent/workspaces/projects/.lcp-cache/pip
Environment=UV_CACHE_DIR=/home/agent/workspaces/projects/.lcp-cache/uv
Environment=PLAYWRIGHT_BROWSERS_PATH=/home/agent/workspaces/projects/.lcp-cache/playwright
Environment=PATH=/usr/local/bin:/usr/bin:/bin:/home/agent/.local/bin:/home/agent/workspaces/projects/.lcp-cache/tools/node_modules/.bin
# Use the physical VPS resources; retain the OS/credential boundary.
MemoryMax=infinity
CPUQuota=
TasksMax=infinity
# Rootless Docker uses a dedicated identity and private local proxy socket.
Environment=DOCKER_HOST=unix:///run/lcp-dev-docker.sock
Environment=GIT_CONFIG_GLOBAL=/home/agent/workspaces/projects/.lcp-cache/gitconfig
ExecStartPost=/usr/local/libexec/lcp-vps-health.py wait-mcp
TimeoutStartSec=90
