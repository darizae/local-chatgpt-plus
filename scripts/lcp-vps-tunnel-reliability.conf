# Drop-in for the existing Aruba tunnel unit; retain its environment and user.
[Unit]
PartOf=lcp-vps.service
StartLimitIntervalSec=0

[Service]
ExecStartPre=/usr/local/libexec/lcp-vps-health.py wait-mcp
ExecStart=
ExecStart=/usr/local/libexec/lcp-vps-health.py supervise -- @ORIGINAL_EXEC_START@
ExecStartPost=/usr/local/libexec/lcp-vps-health.py wait-tunnel
TimeoutStartSec=240
TimeoutStopSec=25
KillMode=control-group
Restart=always
RestartSec=15s
